<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Raghad Elajab portfolio</title>
  <desc id="desc">A warm cream and blush banner introducing Raghad Elajab and her work in AI, software, robotics, and extended reality.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf6"/>
      <stop offset=".58" stop-color="#f7f1eb"/>
      <stop offset="1" stop-color="#eaded7"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop stop-color="#c66f7b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c66f7b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#dfd0c8"/>
    </filter>
    <clipPath id="banner">
      <rect width="1200" height="400" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <circle cx="1010" cy="75" r="270" fill="url(#blush)"/>
    <circle cx="112" cy="382" r="190" fill="#c9b2a8" opacity=".12"/>

    <g fill="none" stroke="#c9b2a8" stroke-width="2" opacity=".72">
      <path d="M870 198 956 112 1056 166 1122 87"/>
      <path d="M870 198 962 274 1081 228"/>
      <path d="M870 198 771 115"/>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <g transform="translate(870 198)">
        <circle r="57" fill="#765f58" stroke="#c66f7b" stroke-width="5"/>
        <text y="-4" fill="#fffaf6" font-size="14" font-weight="700">PROJECT</text>
        <text y="16" fill="#fffaf6" font-size="14" font-weight="700">SYSTEMS</text>
      </g>
      <g transform="translate(956 112)">
        <circle r="37" fill="#fffaf6" stroke="#9a6f67" stroke-width="3"/>
        <path d="M-16 0Q0-14 16 0Q0 14-16 0Z" fill="none" stroke="#765f58" stroke-width="3"/>
        <circle r="5" fill="#765f58"/>
      </g>
      <g transform="translate(1056 166)">
        <circle r="37" fill="#fffaf6" stroke="#9a6f67" stroke-width="3"/>
        <path d="M-13-11H13V12H-13ZM0-11V-20M-7 1h2M7 1h2" fill="none" stroke="#765f58" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g transform="translate(962 274)">
        <circle r="37" fill="#fffaf6" stroke="#9a6f67" stroke-width="3"/>
        <path d="m0-15 14 8v16L0 17l-14-8V-7Zm0 0V1m14-8L0 1-14-7" fill="none" stroke="#765f58" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g transform="translate(771 115)">
        <circle r="37" fill="#fffaf6" stroke="#9a6f67" stroke-width="3"/>
        <path d="M0-15v30M-15 0h30" stroke="#765f58" stroke-width="7"/>
      </g>
      <g transform="translate(1081 228)">
        <circle r="6" fill="#c66f7b"/>
      </g>
    </g>

    <g transform="translate(64 55)">
      <rect width="48" height="48" rx="2" fill="#4d332e" filter="url(#shadow)"/>
      <text x="24" y="33" fill="#fffaf6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" text-anchor="middle">R</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="64" y="154" fill="#b56270" font-size="15" font-weight="700" letter-spacing="4">PORTFOLIO · ABU DHABI</text>
      <text x="64" y="244" fill="#4d332e" font-size="78" font-weight="900" letter-spacing="-4" filter="url(#shadow)">Raghad Elajab.</text>
      <text x="67" y="296" fill="#755f58" font-size="23">AI · Software · Robotics · XR</text>
      <text x="67" y="338" fill="#755f58" font-size="17">Intelligent, interactive systems for people and the physical world.</text>
    </g>
  </g>
</svg>

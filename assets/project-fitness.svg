96" fill="none" stroke="#8ce7c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M770 389H808 M799 382L808 389L799 396" fill="none" stroke="#8ce7c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 585H1136" fill="none" stroke="#294557" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="627" font-size="22" fill="#9eb5c1" font-weight="400" text-anchor="start" >Java Swing · User, Activity and Goal models · File-based persistence</text></g></svg>
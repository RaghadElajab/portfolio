<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="ecoffe-loop-title ecoffe-loop-desc">
<title id="ecoffe-loop-title">ECoffe gameplay loop</title>
<desc id="ecoffe-loop-desc">Take customer orders, prepare and serve food and drinks, sort waste after the shift, earn coins from tips and sorting bonuses, and use the shop to unlock recipes and decorate the caf&#233;. New recipes expand the next shift's menu, beginning the loop again.</desc>
<defs>
  <linearGradient id="ecoffe-loop-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10283e"/><stop offset="1" stop-color="#0b1d30"/></linearGradient>
  <marker id="ecoffe-loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#84edbb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ecoffe-loop-save" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#65c7e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ecoffe-loop-optional" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#ff9bc3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text { font-family: Arial, Helvetica, sans-serif; } .flow { fill:none; stroke:#84edbb; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#ecoffe-loop-arrow); } .label { fill:#b4f3d3; font-size:16px; } .copy { fill:#c7d6e4; font-size:18px; } .heading { fill:#f2f6fa; font-size:22px; font-weight:700; }</style>
</defs>
<rect width="1200" height="280" rx="22" fill="url(#ecoffe-loop-bg)"/>
<rect x=".75" y=".75" width="1198.5" height="278.5" rx="21.25" fill="none" stroke="#355068" stroke-width="1.5"/>
<path class="flow" d="M242 112H263"/>
<path class="flow" d="M472 112H493"/>
<path class="flow" d="M702 112H723"/>
<path class="flow" d="M932 112H953"/>
<path class="flow" d="M1060 183V218Q1060 230 1048 230H152Q140 230 140 218V188"/>
<text x="600" y="219" fill="#b4f3d3" font-size="18" text-anchor="middle">Next shift: more recipes, more possibilities</text>
<g>
<rect x="40" y="42" width="200" height="140" rx="16" fill="#132e44" stroke="#355068" stroke-width="1.5"/>
<text x="140" y="72" fill="#84edbb" font-size="15" font-weight="700" text-anchor="middle">01</text>
<text x="140" y="107" fill="#f2f6fa" font-size="21" font-weight="700" text-anchor="middle">Take orders</text>
<text x="140" y="137" fill="#c7d6e4" font-size="16" text-anchor="middle">Read the request</text>
<text x="140" y="160" fill="#c7d6e4" font-size="16" text-anchor="middle">Watch customer patience</text>
</g>
<g>
<rect x="270" y="42" width="200" height="140" rx="16" fill="#132e44" stroke="#355068" stroke-width="1.5"/>
<text x="370" y="72" fill="#65c7e8" font-size="15" font-weight="700" text-anchor="middle">02</text>
<text x="370" y="107" fill="#f2f6fa" font-size="21" font-weight="700" text-anchor="middle">Prepare + serve</text>
<text x="370" y="137" fill="#c7d6e4" font-size="16" text-anchor="middle">Make food + drinks</text>
<text x="370" y="160" fill="#c7d6e4" font-size="16" text-anchor="middle">Choose cups + plates</text>
</g>
<g>
<rect x="500" y="42" width="200" height="140" rx="16" fill="#132e44" stroke="#355068" stroke-width="1.5"/>
<text x="600" y="72" fill="#ff9bc3" font-size="15" font-weight="700" text-anchor="middle">03</text>
<text x="600" y="107" fill="#f2f6fa" font-size="21" font-weight="700" text-anchor="middle">Sort waste</text>
<text x="600" y="137" fill="#c7d6e4" font-size="16" text-anchor="middle">Throw each item</text>
<text x="600" y="160" fill="#c7d6e4" font-size="16" text-anchor="middle">into the right bin</text>
</g>
<g>
<rect x="730" y="42" width="200" height="140" rx="16" fill="#132e44" stroke="#355068" stroke-width="1.5"/>
<text x="830" y="72" fill="#84edbb" font-size="15" font-weight="700" text-anchor="middle">04</text>
<text x="830" y="107" fill="#f2f6fa" font-size="21" font-weight="700" text-anchor="middle">Review + earn</text>
<text x="830" y="137" fill="#c7d6e4" font-size="16" text-anchor="middle">Check your shift results</text>
<text x="830" y="160" fill="#c7d6e4" font-size="16" text-anchor="middle">Tips + sorting bonuses</text>
</g>
<g>
<rect x="960" y="42" width="200" height="140" rx="16" fill="#132e44" stroke="#355068" stroke-width="1.5"/>
<text x="1060" y="72" fill="#65c7e8" font-size="15" font-weight="700" text-anchor="middle">05</text>
<text x="1060" y="107" fill="#f2f6fa" font-size="21" font-weight="700" text-anchor="middle">Upgrade the caf&#233;</text>
<text x="1060" y="137" fill="#c7d6e4" font-size="16" text-anchor="middle">Unlock recipes</text>
<text x="1060" y="160" fill="#c7d6e4" font-size="16" text-anchor="middle">+ choose your d&#233;cor</text>
</g>
</svg>

<g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="73" font-size="19" fill="#8ce7c0" font-weight="600" text-anchor="start" letter-spacing="3">PREDICTION PIPELINE</text><text x="64" y="144" font-size="44" fill="#e7f2f1" font-weight="600" text-anchor="start" >From vehicle listings to price.</text><text x="64" y="190" font-size="26" fill="#9eb5c1" font-weight="400" text-anchor="start" >Cleaning, feature engineering and neural networks</text><rect x="64" y="273" width="322" height="244" rx="18" fill="#102638" stroke="#294557"/><text x="91" y="318" font-size="18" fill="#9eb5c1" font-weight="600" text-anchor="start" >VEHICLE DATA</text><text x="91" y="407" font-size="57" fill="#8ce7c0" font-weight="600" text-anchor="start" >34,033</text><text x="91" y="458" font-size="23" fill="#9eb5c1" font-weight="400" text-anchor="start" >listings</text><rect x="439" y="273" width="322" height="244" rx="18" fill="#102638" stroke="#294557"/><text x="466" y="318" font-size="18" fill="#9eb5c1" font-weight="600" text-anchor="start" >PREPROCESSING</text><text x="466" y="407" font-size="57" fill="#e7f2f1" font-weight="600" text-anchor="start" >148</text><text x="466" y="458" font-size="23" fill="#9eb5c1" font-weight="400" text-anchor="start" >original features</text><rect x="814" y="273" width="322" height="244" rx="18" fill="#102638" stroke="#294557"/><text x="841" y="318" font-size="18" fill="#9eb5c1" font-weight="600" text-anchor="start" >NEURAL NETWORK</text><text x="841" y="407" font-size="38" fill="#f48cba" font-weight="600" text-anchor="start" >64 → 32 → 16</text><text x="841" y="458" font-size="23" fill="#9eb5c1" font-weight="400" text-anchor="start" >hidden layers</text><path d="M399 397H425 M416 390L425 397L416 404" fill="none" stroke="#8ce7c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M774 397H800 M791 390L800 397L791 404" fill="none" stroke="#8ce7c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 585H1136" fill="none" stroke="#294557" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="627" font-size="22" fill="#9eb5c1" font-weight="400" text-anchor="start" >Clean measurements · Encode categories · Predict log-transformed price</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Car price prediction pipeline</title><desc id="desc">Pipeline diagram showing 34,033 vehicle listings, 148 original features, preprocessing and a 64, 32, 16 neural-network architecture.</desc>
<defs><radialGradient id="glow"><stop stop-color="#173d45"/><stop offset="1" stop-color="#091827"/></radialGradient></defs>
<rect width="100%" height="100%" fill="#091827"/>

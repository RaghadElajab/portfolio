<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">Crop model test accuracy</title><desc id="desc">Zero-based horizontal bars compare four architectures. EfficientNet-B0 leads with 85.89% maize accuracy and 95.73% cashew accuracy.</desc>

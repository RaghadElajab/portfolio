ext-anchor="start" >Custom CNN</text><rect x="294" y="231" width="528.2795" height="29" rx="6" fill="#f48cba" stroke="#f48cba"/><text x="833.2795" y="254" font-size="20" fill="#f48cba" font-weight="600" text-anchor="start" >70.91%</text><rect x="294" y="271" width="670.7235000000001" height="29" rx="6" fill="#8ce7c0" stroke="#8ce7c0"/><text x="975.7235000000001" y="294" font-size="20" fill="#8ce7c0" font-weight="600" text-anchor="start" >90.03%</text><text x="64" y="389" font-size="23" fill="#e7f2f1" font-weight="400" text-anchor="start" >ResNet-18</text><rect x="294" y="342" width="600.47" height="29" rx="6" fill="#f48cba" stroke="#f48cba"/><text x="905.47" y="365" font-size="20" fill="#f48cba" font-weight="600" text-anchor="start" >80.60%</text><rect x="294" y="382" width="712.4435" height="29" rx="6" fill="#8ce7c0" stroke="#8ce7c0"/><text x="1017.4435" y="405" font-size="20" fill="#8ce7c0" font-weight="600" text-anchor="start" >95.63%</text><text x="64" y="500" font-size="23" fill="#e7f2f1" font-weight="600" text-anchor="start" >EfficientNet-B0</text><rect x="294" y="453" width="639.8805" height="29" rx="6" fill="#f48cba" stroke="#f48cba"/><text x="944.8805" y="476" font-size="20" fill="#f48cba" font-weight="600" text-anchor="start" >85.89%</text><rect x="294" y="493" width="713.1885000000001" height="29" rx="6" fill="#8ce7c0" stroke="#8ce7c0"/><text x="1018.1885000000001" y="516" font-size="20" fill="#8ce7c0" font-weight="600" text-anchor="start" >95.73%</text><text x="64" y="611" font-size="23" fill="#e7f2f1" font-weight="400" text-anchor="start" >VGG-16</text><rect x="294" y="564" width="503.8435" height="29" rx="6" fill="#f48cba" stroke="#f48cba"/><text x="808.8435" y="587" font-size="20" fill="#f48cba" font-weight="600" text-anchor="start" >67.63%</text><rect x="294" y="604" width="670.7235000000001" height="29" rx="6" fill="#8ce7c0" stroke="#8ce7c0"/><text x="975.7235000000001" y="627" font-size="20" fill="#8ce7c0" font-weight="600" text-anchor="start" >90.03%</text><text x="64" y="767" font-size="23" fill="#9eb5c1" font-weight="400" text-anchor="start" >EfficientNet-B0 achieved the highest test accuracy for both crops.</text></g></svg>
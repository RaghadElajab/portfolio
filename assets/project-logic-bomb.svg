<g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="73" font-size="19" fill="#9a6f67" font-weight="600" text-anchor="start" letter-spacing="3">REVERSE-ENGINEERING WORKFLOW</text><text x="64" y="144" font-size="44" fill="#4b302d" font-weight="600" text-anchor="start" >Read the binary. Recover the logic.</text><text x="64" y="190" font-size="26" fill="#765f57" font-weight="400" text-anchor="start" >Static disassembly and instruction-level debugging</text><rect x="64" y="273" width="322" height="244" rx="18" fill="#fffaf6" stroke="#c9b2a8"/><text x="91" y="318" font-size="18" fill="#9a6f67" font-weight="600" text-anchor="start" >DISASSEMBLE</text><text x="91" y="389" font-size="28" fill="#4b302d" font-weight="600" text-anchor="start" >Map phases + helpers</text><text x="91" y="438" font-size="21" fill="#765f57" font-weight="400" text-anchor="start" >x86-64 / GDB</text><rect x="439" y="273" width="322" height="244" rx="18" fill="#fffaf6" stroke="#c9b2a8"/><text x="466" y="318" font-size="18" fill="#b56270" font-weight="600" text-anchor="start" >TRACE</text><text x="466" y="389" font-size="28" fill="#4b302d" font-weight="600" text-anchor="start" >Breakpoints + memory</text><text x="466" y="438" font-size="21" fill="#765f57" font-weight="400" text-anchor="start" >x86-64 / GDB</text><rect x="814" y="273" width="322" height="244" rx="18" fill="#fffaf6" stroke="#c9b2a8"/><text x="841" y="318" font-size="18" fill="#9a6f67" font-weight="600" text-anchor="start" >RECONSTRUCT</text><text x="841" y="389" font-size="28" fill="#4b302d" font-weight="600" text-anchor="start" >Recover constraints</text><text x="841" y="438" font-size="21" fill="#765f57" font-weight="400" text-anchor="start" >6 phases + secret phase</text><path d="M399 397H425 M416 390L425 397L416 404" fill="none" stroke="#9a6f67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M774 397H800 M791 390L800 397L791 404" fill="none" stroke="#9a6f67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 585H1136" fill="none" stroke="#c9b2a8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="627" font-size="22" fill="#765f57" font-weight="400" text-anchor="start" >objdump · Registers · Stack memory · Jump tables · Recursive structures</text></g></svg>
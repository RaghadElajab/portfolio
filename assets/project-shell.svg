<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Networked shell architecture</title><desc id="desc">Architecture diagram: CLI client sends commands over TCP to a shell server using fork, exec and Unix pipes.</desc>
<defs><radialGradient id="glow"><stop stop-color="#eaded7"/><stop offset="1" stop-color="#f7f1eb"/></radialGradient></defs>
<rect width="100%" height="100%" fill="#f7f1eb"/>
<ellipse cx="900" cy="60" rx="600" ry="550" fill="url(#glow)" opacity=".65"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="73" font-size="19" fill="#9a6f67" font-weight="600" text-anchor="start" letter-spacing="3">SYSTEM ARCHITECTURE</text><text x="64" y="144" font-size="44" fill="#4b302d" font-weight="600" text-anchor="start" >One command. Connected processes.</text><text x="64" y="190" font-size="26" fill="#765f57" font-weight="400" text-anchor="start" >A TCP shell with Unix pipelines</text><rect x="64" y="267" width="295" height="225" rx="18" fill="#fffaf6" stroke="#c9b2a8"/><rect x="469" y="267" width="667" height="225" rx="18" fill="#fffaf6" stroke="#c9b2a8"/><text x="98" y="314" font-size="20" fill="#765f57" font-weight="600" text-anchor="start" >CLI CLIENT</text><text x="98" y="381" font-size="33" fill="#9a6f67" font-weight="600" text-anchor="start" font-family="Consolas, monospace">$ ls | sort</text><text x="98" y="438" font-size="24" fill="#765f57" font-weight="400" text-anchor="start" >input / output</text><path d="M374 363H451 M442 356L451 363L442 370" fill="none" stroke="#9a6f67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="412" y="334" font-size="18" fill="#765f57" font-weight="400" text-anchor="middle" >TCP</text><text x="502" y="314" font-size="20" fill="#765f57" font-weight="600" text-anchor="start" >SHELL SERVER</text><rect x="501" y="342" width="260" height="75" rx="12" fill="#eaded7" stroke="#9a6f67"/><rect x="802" y="342" width="300" height="75" rx="12" fill="#f3eae5" stroke="#b56270"/><text x="631" y="389" font-size="31" fill="#9a6f67" font-weight="600" text-anchor="middle" >fork / exec</text><text x="952" y="389" font-size="31" fill="#b56270" font-weight="600" text-anchor="middle" >Unix pipes</text><path d="M771 379H790 M781 372L790 379L781 386" fill="none" stroke="#9a6f67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="502" y="459" font-size="24" fill="#765f57" font-weight="400" text-anchor="start" >Up to four command stages</text><path d="M64 585H1136" fill="none" stroke="#c9b2a8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="627" font-size="22" fill="#765f57" font-weight="400" text-anchor="start" >C · POSIX · TCP sockets · Per-client working directory</text></g></svg>